<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="900" height="950" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="950" fill="#f8f5f0"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">مخطط الطابق الأرضي — Ground Floor</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#7f8c8d">المساحة الكلية: 130 م²  |  أرض: 250 م² (10م × 25م)</text>

  <!-- ═══════════════ GARAGE (outside, top) ═══════════════ -->
  <rect x="60" y="75" width="220" height="110" fill="#dce8f5" stroke="#2980b9" stroke-width="2.5" rx="4"/>
  <text x="170" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#2980b9">كراج</text>
  <text x="170" y="138" text-anchor="middle" font-size="12" fill="#2980b9">Garage</text>
  <text x="170" y="156" text-anchor="middle" font-size="11" fill="#5d8aa8">4.5م × 5م = 22 م²</text>

  <!-- Garage door -->
  <line x1="60" y1="185" x2="280" y2="185" stroke="#2980b9" stroke-width="4" stroke-dasharray="12,6"/>

  <!-- Entrance path -->
  <rect x="280" y="75" width="560" height="110" fill="#eaf5ea" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="560" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">ممر مدخل رئيسي</text>
  <text x="560" y="145" text-anchor="middle" font-size="11" fill="#27ae60">Main Entrance Path</text>
  <!-- Main door symbol -->
  <rect x="490" y="178" width="70" height="7" fill="#e74c3c" rx="2"/>
  <text x="525" y="172" text-anchor="middle" font-size="10" fill="#e74c3c">باب رئيسي</text>

  <!-- ═══════════════ HOUSE OUTLINE ═══════════════ -->
  <rect x="60" y="185" width="780" height="650" fill="none" stroke="#2c3e50" stroke-width="4"/>

  <!-- ══ ZONE DIVIDERS (vertical: left=60-420, center=420-480, right=480-840) ══ -->

  <!-- ═══════════════ ROW 1: FRONT ZONE (y=185 to y=445, height=260) ═══════════════ -->

  <!-- مجلس الضيوف — Guest Reception (left, 360×260) -->
  <rect x="60" y="185" width="360" height="260" fill="#fef9e7" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="240" y="290" text-anchor="middle" font-size="18" font-weight="bold" fill="#e67e22">مجلس الضيوف</text>
  <text x="240" y="314" text-anchor="middle" font-size="13" fill="#e67e22">Guest Reception</text>
  <text x="240" y="338" text-anchor="middle" font-size="13" fill="#95a5a6">4م × 4م = 16 م²</text>
  <!-- Sofa symbols -->
  <rect x="110" y="360" width="120" height="35" fill="#f39c12" rx="5" opacity="0.5"/>
  <rect x="110" y="395" width="35" height="35" fill="#f39c12" rx="5" opacity="0.5"/>
  <rect x="195" y="395" width="35" height="35" fill="#f39c12" rx="5" opacity="0.5"/>
  <rect x="290" y="360" width="100" height="70" fill="#f39c12" rx="5" opacity="0.4"/>

  <!-- صالة المعيشة — Family Living (right, 360×260) -->
  <rect x="480" y="185" width="360" height="260" fill="#eaf4fb" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="660" y="290" text-anchor="middle" font-size="18" font-weight="bold" fill="#2980b9">صالة المعيشة العائلية</text>
  <text x="660" y="314" text-anchor="middle" font-size="13" fill="#2980b9">Family Living Room</text>
  <text x="660" y="338" text-anchor="middle" font-size="13" fill="#95a5a6">6م × 5م = 30 م²</text>
  <text x="660" y="360" text-anchor="middle" font-size="11" fill="#e74c3c">★ أكبر من المجلس</text>
  <!-- TV + sofa symbols -->
  <rect x="510" y="355" width="120" height="55" fill="#2980b9" rx="5" opacity="0.3"/>
  <rect x="640" y="355" width="30" height="55" fill="#2980b9" rx="3" opacity="0.3"/>
  <rect x="680" y="380" width="120" height="30" fill="#7f8c8d" rx="3" opacity="0.4"/>

  <!-- مدخل + درج — Entrance & Stairs (center, 120×260) -->
  <rect x="420" y="185" width="60" height="130" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="450" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">مدخل</text>
  <text x="450" y="248" text-anchor="middle" font-size="10" fill="#7f8c8d">Entrance</text>
  <rect x="420" y="315" width="60" height="130" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <!-- Stair lines -->
  <text x="450" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">درج</text>
  <line x1="422" y1="370" x2="478" y2="370" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="382" x2="478" y2="382" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="394" x2="478" y2="394" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="406" x2="478" y2="406" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="418" x2="478" y2="418" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="430" x2="478" y2="430" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="442" x2="478" y2="442" stroke="#7f8c8d" stroke-width="1.5"/>

  <!-- ═══════════════ ROW 2: MIDDLE ZONE (y=445 to y=655, height=210) ═══════════════ -->

  <!-- مطبخ + سفرة — Kitchen + Dining (left, 360×210) -->
  <rect x="60" y="445" width="360" height="210" fill="#e9f7ef" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="240" y="525" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">مطبخ + سفرة</text>
  <text x="240" y="547" text-anchor="middle" font-size="12" fill="#27ae60">Kitchen + Dining</text>
  <text x="240" y="568" text-anchor="middle" font-size="12" fill="#95a5a6">4م × 4م = 16 م²</text>
  <!-- Kitchen counter -->
  <rect x="80" y="456" width="320" height="28" fill="#27ae60" rx="3" opacity="0.35"/>
  <text x="240" y="473" text-anchor="middle" font-size="10" fill="#1a5c36">طاولة طعام</text>
  <!-- Table -->
  <rect x="130" y="510" width="140" height="80" fill="#a9dfbf" rx="6" opacity="0.5"/>
  <circle cx="130" cy="510" r="8" fill="#27ae60" opacity="0.5"/>
  <circle cx="270" cy="510" r="8" fill="#27ae60" opacity="0.5"/>
  <circle cx="130" cy="590" r="8" fill="#27ae60" opacity="0.5"/>
  <circle cx="270" cy="590" r="8" fill="#27ae60" opacity="0.5"/>

  <!-- غرفة طعام رسمية — Formal Dining (right, 360×210) -->
  <rect x="480" y="445" width="360" height="210" fill="#fdfefe" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="660" y="525" text-anchor="middle" font-size="16" font-weight="bold" fill="#8e44ad">غرفة طعام رسمية</text>
  <text x="660" y="547" text-anchor="middle" font-size="12" fill="#8e44ad">Formal Dining Room</text>
  <text x="660" y="568" text-anchor="middle" font-size="12" fill="#95a5a6">4م × 3م = 12 م²</text>
  <!-- Table -->
  <ellipse cx="660" cy="535" rx="90" ry="45" fill="#d7bde2" opacity="0.5"/>
  <circle cx="580" cy="535" r="8" fill="#8e44ad" opacity="0.4"/>
  <circle cx="740" cy="535" r="8" fill="#8e44ad" opacity="0.4"/>
  <circle cx="620" cy="490" r="8" fill="#8e44ad" opacity="0.4"/>
  <circle cx="700" cy="490" r="8" fill="#8e44ad" opacity="0.4"/>
  <circle cx="620" cy="580" r="8" fill="#8e44ad" opacity="0.4"/>
  <circle cx="700" cy="580" r="8" fill="#8e44ad" opacity="0.4"/>

  <!-- حمام ضيوف + مشترك — Guest + Shared Bathroom (center, 60×210) -->
  <rect x="420" y="445" width="60" height="105" fill="#d6eaf8" stroke="#2c3e50" stroke-width="2"/>
  <text x="450" y="482" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a5276">ح.</text>
  <text x="450" y="496" text-anchor="middle" font-size="10" fill="#1a5276">ضيوف</text>
  <!-- toilet symbol -->
  <ellipse cx="450" cy="528" rx="12" ry="14" fill="#aed6f1" stroke="#1a5276" stroke-width="1.5"/>

  <rect x="420" y="550" width="60" height="105" fill="#d6eaf8" stroke="#2c3e50" stroke-width="2"/>
  <text x="450" y="585" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a5276">ح.</text>
  <text x="450" y="599" text-anchor="middle" font-size="10" fill="#1a5276">مشترك</text>
  <ellipse cx="450" cy="632" rx="12" ry="14" fill="#aed6f1" stroke="#1a5276" stroke-width="1.5"/>

  <!-- ═══════════════ ROW 3: BACK ZONE (y=655 to y=835, height=180) ═══════════════ -->

  <!-- غرفة الوالدين — Parents Bedroom (left, 290×180) -->
  <rect x="60" y="655" width="290" height="180" fill="#fdedec" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="205" y="725" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">غرفة الوالدين</text>
  <text x="205" y="747" text-anchor="middle" font-size="12" fill="#c0392b">Parents Bedroom</text>
  <text x="205" y="768" text-anchor="middle" font-size="12" fill="#95a5a6">4م × 4م = 16 م²</text>
  <!-- Bed symbol -->
  <rect x="100" y="780" width="130" height="45" fill="#e74c3c" rx="8" opacity="0.4"/>
  <rect x="100" y="780" width="65" height="18" fill="#c0392b" rx="4" opacity="0.5"/>
  <rect x="165" y="780" width="65" height="18" fill="#c0392b" rx="4" opacity="0.5"/>

  <!-- حمام خاص الوالدين — Private Bathroom (small, 130×180) -->
  <rect x="350" y="655" width="130" height="180" fill="#d6eaf8" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="415" y="718" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5276">حمام</text>
  <text x="415" y="736" text-anchor="middle" font-size="12" fill="#1a5276">خاص</text>
  <text x="415" y="754" text-anchor="middle" font-size="11" fill="#1a5276">والدين</text>
  <text x="415" y="772" text-anchor="middle" font-size="10" fill="#95a5a6">2م×3م=6م²</text>
  <!-- Bath + toilet -->
  <rect x="365" y="785" width="80" height="35" fill="#aed6f1" rx="6" stroke="#1a5276" stroke-width="1.5"/>
  <ellipse cx="435" cy="760" rx="10" ry="13" fill="#aed6f1" stroke="#1a5276" stroke-width="1.5"/>

  <!-- back open area center + right -->
  <rect x="480" y="655" width="360" height="180" fill="#f9f9f9" stroke="#2c3e50" stroke-width="2"/>
  <text x="660" y="740" text-anchor="middle" font-size="14" fill="#95a5a6">مستودع / مساحة خدمة</text>
  <text x="660" y="760" text-anchor="middle" font-size="12" fill="#bdc3c7">Storage / Service Area</text>

  <!-- Back door to garden -->
  <rect x="385" y="831" width="70" height="7" fill="#27ae60" rx="2"/>
  <text x="420" y="825" text-anchor="middle" font-size="10" fill="#27ae60">باب الحديقة</text>

  <!-- ═══════════════ GARDEN (below house) ═══════════════ -->
  <rect x="60" y="838" width="780" height="100" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.5" rx="6"/>
  <text x="450" y="883" text-anchor="middle" font-size="18" font-weight="bold" fill="#27ae60">🌿 الحديقة الخلفية — Back Garden</text>
  <text x="450" y="905" text-anchor="middle" font-size="13" fill="#27ae60">10م × 7م = 70 م²</text>

  <!-- ═══════════════ DIMENSION LINES ═══════════════ -->
  <!-- Width arrow -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2c3e50"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- Compass -->
  <circle cx="820" cy="130" r="28" fill="white" stroke="#2c3e50" stroke-width="2"/>
  <text x="820" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#e74c3c">N ↑</text>
  <text x="820" y="130" text-anchor="middle" font-size="9" fill="#2c3e50">شمال</text>
  <text x="820" y="148" text-anchor="middle" font-size="9" fill="#2c3e50">جنوب ↓</text>

  <!-- Legend -->
  <rect x="60" y="940" width="15" height="10" fill="#fef9e7" stroke="#e67e22" stroke-width="1.5"/>
  <text x="80" y="950" font-size="10" fill="#e67e22">مجلس</text>
  <rect x="135" y="940" width="15" height="10" fill="#eaf4fb" stroke="#2980b9" stroke-width="1.5"/>
  <text x="155" y="950" font-size="10" fill="#2980b9">معيشة</text>
  <rect x="215" y="940" width="15" height="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="235" y="950" font-size="10" fill="#27ae60">مطبخ</text>
  <rect x="285" y="940" width="15" height="10" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/>
  <text x="305" y="950" font-size="10" fill="#c0392b">والدين</text>
  <rect x="360" y="940" width="15" height="10" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.5"/>
  <text x="380" y="950" font-size="10" fill="#1a5276">حمام</text>
  <rect x="420" y="940" width="15" height="10" fill="#dce8f5" stroke="#2980b9" stroke-width="1.5"/>
  <text x="440" y="950" font-size="10" fill="#2980b9">كراج</text>

</svg>
