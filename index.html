<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport: منع التكبير التلقائي عند الضغط على الإدخالات في iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA / إضافة للشاشة الرئيسية -->
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ردود الأثاث" />

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <title>ردود الأثاث 🛋️</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { height: 100%; }
      body {
        background: #0d0d0d;
        color: #f0f0f0;
        height: 100%;
        /* منع التمرير الجانبي على الهاتف */
        overflow-x: hidden;
      }
      #root { height: 100%; }

      /* Safe area للهواتف ذات الشق (notch) */
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
