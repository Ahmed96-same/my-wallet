  <rect x="780" y="155" width="60" height="270" fill="#d6eaf8" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="810" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5276">حمام</text>
  <text x="810" y="265" text-anchor="middle" font-size="11" fill="#1a5276">خاص</text>
  <text x="810" y="282" text-anchor="middle" font-size="10" fill="#1a5276">غرفة 4</text>
  <text x="810" y="299" text-anchor="middle" font-size="9" fill="#95a5a6">4 م²</text>
  <rect x="791" y="315" width="38" height="55" fill="#aed6f1" rx="5" stroke="#1a5276" stroke-width="1.5"/>
  <ellipse cx="810" cy="385" rx="13" ry="14" fill="#aed6f1" stroke="#1a5276" stroke-width="1.5"/>

  <!-- ═══════════════ BOTTOM-RIGHT: Bedroom 5 (Guests) ═══════════════ -->
  <rect x="480" y="425" width="300" height="220" fill="#f5eef8" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="630" y="488" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e44ad">غرفة 5</text>
  <text x="630" y="508" text-anchor="middle" font-size="12" fill="#8e44ad">غرفة الضيوف</text>
  <text x="630" y="528" text-anchor="middle" font-size="11" fill="#95a5a6">4م × 3.5م = 14 م²</text>
  <!-- Bed -->
  <rect x="530" y="545" width="120" height="70" fill="#d2b4de" rx="10" opacity="0.6"/>
  <rect x="530" y="545" width="57" height="22" fill="#8e44ad" rx="5" opacity="0.6"/>
  <rect x="593" y="545" width="57" height="22" fill="#8e44ad" rx="5" opacity="0.6"/>

  <!-- Bathroom 5 (private) -->
  <rect x="780" y="425" width="60" height="220" fill="#d6eaf8" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="810" y="498" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5276">حمام</text>
  <text x="810" y="515" text-anchor="middle" font-size="11" fill="#1a5276">خاص</text>
  <text x="810" y="532" text-anchor="middle" font-size="10" fill="#1a5276">غرفة 5</text>
  <text x="810" y="549" text-anchor="middle" font-size="9" fill="#95a5a6">4 م²</text>
  <rect x="791" y="560" width="38" height="50" fill="#aed6f1" rx="5" stroke="#1a5276" stroke-width="1.5"/>
  <ellipse cx="810" cy="625" rx="13" ry="14" fill="#aed6f1" stroke="#1a5276" stroke-width="1.5"/>

  <!-- ═══════════════ BOTTOM: Storage + Laundry ═══════════════ -->
  <rect x="480" y="645" width="300" height="70" fill="#fdfefe" stroke="#2c3e50" stroke-width="2"/>
  <text x="630" y="682" text-anchor="middle" font-size="13" fill="#7f8c8d">غرفة غسيل + مخزن</text>
  <text x="630" y="700" text-anchor="middle" font-size="11" fill="#bdc3c7">Laundry + Storage — 8 م²</text>

  <!-- ═══════════════ COMPASS ═══════════════ -->
  <circle cx="830" cy="108" r="28" fill="white" stroke="#2c3e50" stroke-width="2"/>
  <text x="830" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#e74c3c">N ↑</text>
  <text x="830" y="108" text-anchor="middle" font-size="9" fill="#2c3e50">شمال</text>
  <text x="830" y="126" text-anchor="middle" font-size="9" fill="#2c3e50">جنوب ↓</text>

  <!-- ═══════════════ BATHROOM BADGE ═══════════════ -->
  <rect x="60" y="735" width="780" height="75" fill="#eaf4fb" stroke="#2980b9" stroke-width="1.5" rx="6"/>
  <text x="450" y="762" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">ملخص الحمامات في هذا الطابق</text>
  <text x="180" y="786" text-anchor="middle" font-size="12" fill="#c0392b">● حمام غرفة 2 (5م²)</text>
  <text x="370" y="786" text-anchor="middle" font-size="12" fill="#2980b9">● حمام غرفة 3 (5م²)</text>
  <text x="560" y="786" text-anchor="middle" font-size="12" fill="#c0392b">● حمام غرفة 4 (4م²)</text>
  <text x="750" y="786" text-anchor="middle" font-size="12" fill="#8e44ad">● حمام غرفة 5 (4م²)</text>
  <text x="450" y="804" text-anchor="middle" font-size="11" fill="#7f8c8d">+ 3 حمامات في الطابق الأرضي = إجمالي 7 حمامات في المبنى</text>

</svg>
