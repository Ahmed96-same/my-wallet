  <rect x="420" y="155" width="60" height="560" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="450" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">م</text>
  <text x="450" y="328" text-anchor="middle" font-size="12" fill="#2c3e50">م</text>
  <text x="450" y="346" text-anchor="middle" font-size="12" fill="#2c3e50">ر</text>
