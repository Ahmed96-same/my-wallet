  <rect x="530" y="270" width="120" height="70" fill="#f1948a" rx="10" opacity="0.6"/>
  <rect x="530" y="270" width="120" height="22" fill="#c0392b" rx="5" opacity="0.6"/>
  <!-- Wardrobe -->
  <rect x="660" y="165" width="110" height="35" fill="#d5d8dc" rx="3" opacity="0.8"/>
  <text x="715" y="186" text-anchor="middle" font-size="10" fill="#2c3e50">خزانة</text>
