  <rect x="80" y="545" width="140" height="80" fill="#a9cce3" rx="10" opacity="0.7"/>
  <rect x="80" y="545" width="68" height="25" fill="#2980b9" rx="5" opacity="0.6"/>
  <rect x="152" y="545" width="68" height="25" fill="#2980b9" rx="5" opacity="0.6"/>
  <!-- Wardrobe -->
  <rect x="240" y="435" width="110" height="35" fill="#d5d8dc" rx="3" opacity="0.8"/>
  <text x="295" y="456" text-anchor="middle" font-size="10" fill="#2c3e50">خزانة</text>

  <!-- Bathroom 3 (private) -->
  <rect x="360" y="425" width="60" height="290" fill="#d6eaf8" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="390" y="512" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5276">حمام</text>
  <text x="390" y="529" text-anchor="middle" font-size="11" fill="#1a5276">خاص</text>
  <text x="390" y="547" text-anchor="middle" font-size="10" fill="#1a5276">غرفة 3</text>
  <text x="390" y="565" text-anchor="middle" font-size="9" fill="#95a5a6">5 م²</text>
  <rect x="371" y="580" width="38" height="70" fill="#aed6f1" rx="6" stroke="#1a5276" stroke-width="1.5"/>
  <ellipse cx="390" cy="665" rx="13" ry="15" fill="#aed6f1" stroke="#1a5276" stroke-width="1.5"/>

