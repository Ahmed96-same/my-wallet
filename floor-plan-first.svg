  <rect x="480" y="155" width="300" height="270" fill="#f9ebea" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="630" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">غرفة 4</text>
