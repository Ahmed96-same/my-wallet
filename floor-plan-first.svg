<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="820" fill="#f8f5f0"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">مخطط الطابق الأول — First Floor</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#7f8c8d">المساحة الكلية: 130 م²  |  5 غرف نوم · 7 حمامات في المبنى</text>

  <!-- ═══════════════ BALCONY (top) ═══════════════ -->
  <rect x="60" y="75" width="780" height="80" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.5" rx="4" stroke-dasharray="8,4"/>
  <text x="450" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">بلكونة أمامية — Front Balcony</text>
  <text x="450" y="132" text-anchor="middle" font-size="12" fill="#27ae60">10م × 1.8م = 18 م²</text>

  <!-- ═══════════════ HOUSE OUTLINE ═══════════════ -->
  <rect x="60" y="155" width="780" height="560" fill="none" stroke="#2c3e50" stroke-width="4"/>

  <!-- ═══════════════ VERTICAL DIVIDERS ═══════════════ -->
  <!-- Left zone: x=60 to x=420 (360px = ~4.5م) -->
  <!-- Center: x=420 to x=480 (60px = ~0.75م corridor) -->
  <!-- Right zone: x=480 to x=840 (360px = ~4.5م) -->

  <!-- ═══════════════ TOP-LEFT: Bedroom 2 (me + wife) ═══════════════ -->
  <rect x="60" y="155" width="300" height="270" fill="#fef9e7" stroke="#2c3e50" stroke-width="2.5"/>
  <!-- Room label -->
  <text x="210" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#e67e22">غرفة 2</text>
  <text x="210" y="238" text-anchor="middle" font-size="12" fill="#e67e22">أنا + زوجتي</text>
  <text x="210" y="258" text-anchor="middle" font-size="11" fill="#95a5a6">4م × 4م = 16 م²</text>
  <!-- Bed symbol -->
  <rect x="80" y="270" width="140" height="80" fill="#f0d9a0" rx="10" opacity="0.7"/>
  <rect x="80" y="270" width="68" height="25" fill="#e67e22" rx="5" opacity="0.6"/>
  <rect x="152" y="270" width="68" height="25" fill="#e67e22" rx="5" opacity="0.6"/>
  <text x="150" y="325" text-anchor="middle" font-size="10" fill="#7f8c8d">سرير مزدوج</text>
  <!-- Wardrobe -->
  <rect x="240" y="165" width="110" height="35" fill="#d5d8dc" rx="3" opacity="0.8"/>
  <text x="295" y="186" text-anchor="middle" font-size="10" fill="#2c3e50">خزانة</text>

  <!-- Bathroom 2 (private) -->
  <rect x="360" y="155" width="60" height="270" fill="#d6eaf8" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="390" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5276">حمام</text>
  <text x="390" y="252" text-anchor="middle" font-size="11" fill="#1a5276">خاص</text>
  <text x="390" y="270" text-anchor="middle" font-size="10" fill="#1a5276">غرفة 2</text>
  <text x="390" y="288" text-anchor="middle" font-size="9" fill="#95a5a6">5 م²</text>
  <!-- Bath symbol -->
  <rect x="371" y="305" width="38" height="70" fill="#aed6f1" rx="6" stroke="#1a5276" stroke-width="1.5"/>
  <!-- Toilet symbol -->
  <ellipse cx="390" cy="390" rx="13" ry="15" fill="#aed6f1" stroke="#1a5276" stroke-width="1.5"/>

  <!-- ═══════════════ BOTTOM-LEFT: Bedroom 3 (brother + wife) ═══════════════ -->
  <rect x="60" y="425" width="300" height="290" fill="#eaf4fb" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="210" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#2980b9">غرفة 3</text>
  <text x="210" y="510" text-anchor="middle" font-size="12" fill="#2980b9">أخي + زوجته</text>
  <text x="210" y="530" text-anchor="middle" font-size="11" fill="#95a5a6">4م × 4م = 16 م²</text>
