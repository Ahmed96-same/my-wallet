  <text x="450" y="420" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f8c8d">درج</text>
  <line x1="422" y1="432" x2="478" y2="432" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="446" x2="478" y2="446" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="460" x2="478" y2="460" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="474" x2="478" y2="474" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="488" x2="478" y2="488" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="502" x2="478" y2="502" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="516" x2="478" y2="516" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="422" y1="530" x2="478" y2="530" stroke="#7f8c8d" stroke-width="1.5"/>

